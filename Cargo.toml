[workspace]
members = [
    "stellar-contracts",
    "backend-2fa",
]
resolver = "2"

[profile.dev]
panic = "unwind"

[profile.test]
panic = "unwind"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# Soroban resource-budget regression checks (issue #1345).
# The `budget-tests` feature gates the worst-case resource-budget
# snapshots for the largest PetChain workflows (registration, record,
# consent, claim, pagination). CI enables it so the budget suite runs
# alongside the normal contract tests and reports the specific resource
# (instructions, memory, or storage) that regressed.
[workspace.metadata.soroban-budgets]
feature = "budget-tests"
report = "instructions,memory,storage"
