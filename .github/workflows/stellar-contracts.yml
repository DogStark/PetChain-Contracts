name: Stellar Contracts CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Refresh the resource-budget baseline snapshot"
        type: boolean
        default: false

permissions: read-all

# Supply-chain hardening (Issue #1228): every third-party action below is
# pinned to an immutable 40-character commit SHA rather than a floating tag.
# The human-readable release is kept as a trailing comment so upgrades stay
# reviewable. Update ownership: the repository maintainers on the security
# rotation review and merge Dependabot PRs that refresh these SHAs; see
# CONTRIBUTING.md for the pinning policy.

env:
  STELLAR_NETWORK: testnet
  STELLAR_RPC_URL: https://soroban-testnet.stellar.org
  STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
  # Soroban currently enforces a ~128KB max WASM contract size; keeping a 100KB
  # budget catches size regressions early while leaving headroom.
  MAX_WASM_SIZE_KB: 100
  # Pinned Rust toolchain (Issue #1348). Keep in sync with
  # stellar-contracts/rust-toolchain.toml so local and CI builds are
  # reproducible. Bump deliberately, never float on "stable".
  RUST_TOOLCHAIN: "1.81.0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        working-directory: stellar-contracts
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # Denied-warning policy (Issue #1348):
      #   -D warnings            -> every rustc/clippy warning is an error
      #   -D clippy::all         -> default correctness/style/complexity lints
      #   -D clippy::suspicious  -> likely-bug lints
      #   -D clippy::perf        -> performance regressions
      #   -D clippy::unwrap_used -> no panicking unwraps in contract code
      #   -D clippy::expect_used -> no panicking expects in contract code
      #   -D clippy::panic       -> no explicit panics in contract code
      #   -D clippy::todo        -> no unfinished code paths
      #   -D clippy::unimplemented -> no unimplemented code paths
      # Allowed (documented) exceptions:
      #   -A clippy::too_many_arguments -> Soroban entrypoints legitimately take
      #     many typed arguments; splitting them would change the ABI.
      #   -A clippy::module_name_repetitions -> contract module naming mirrors
      #     the public ABI surface.
      - name: Run clippy with denied warnings
        working-directory: stellar-contracts
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::all \
            -D clippy::suspicious \
            -D clippy::perf \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented \
            -A clippy::too_many_arguments \
            -A clippy::module_name_repetitions

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd7bfc695f644621a5a4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        working-directory: stellar-contracts
        run: cargo audit --deny warnings

  abi-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Detects unreviewed changes to the contract's public function
      # signatures (Issue #1147). See stellar-contracts/docs/abi-migrations.md
      # for what to do if this fails.
      - name: Check ABI snapshot is up to date
        working-directory: stellar-contracts
        run: ./scripts/generate_abi_snapshot.sh --check

  abi-diff:
    runs-on: ubuntu-latest
    needs: abi-snapshot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Generates the deterministic error registry from the contract source
      # (Issue #1330) and fails if the committed snapshot is stale. This keeps
      # every public error's code, meaning, and retryability in sync with the
      # contracts and prevents discriminants from changing silently.
      - name: Check error registry snapshot is up to date
        working-directory: stellar-contracts

  error-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Guards the Soroban storage schema version (Issue #1333). The check
      # fails when the declared schema version is bumped without adding a
      # matching old-version fixture snapshot under
      # stellar-contracts/tests/fixtures/storage/, so upgrade tests always
      # have a supported fixture to read.
      - name: Check storage schema version has fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Guards the Soroban storage schema version (Issue #1333). The check
      # fails when the declared schema version is bumped without adding a
      # matching old-version fixture snapshot under
      # stellar-contracts/tests/fixtures/storage/, so upgrade tests always
      # have a supported fixture to read.
      - name: Check storage schema version has fixtures
        working-directory: stellar-contracts
        run: ./scripts/check_schema_version.sh

      # Generates the deterministic error registry from the contract source
      # (Issue #1330) and fails if the committed snapshot is stale. This keeps
      # every public error's code, meaning, and retryability in sync with the
      # contracts and prevents discriminants from changing silently.
      - name: Check error registry snapshot is up to date
        working-directory: stellar-contracts
        run: ./scripts/generate_error_registry.sh --check

  abi-diff:
    runs-on: ubuntu-latest
    needs: abi-snapshot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Detects breaking changes in the contract's public ABI and
      # requires a migration note in docs/abi-migrations.md when
      # breaking changes are present (Issue #1351).
      - name: Check for breaking ABI changes
        working-directory: stellar-contracts
        run: |
          # Regenerate the snapshot from the current source
          ./scripts/generate_abi_snapshot.sh
          # Diff the regenerated snapshot against the committed one
          if ! ./scripts/generate_abi_snapshot.sh --diff; then
            echo ""
            echo "ERROR: breaking ABI changes detected without a migration note."
            echo "Add an entry to docs/abi-migrations.md describing the change"
            echo "and its ledger-compatibility impact, then regenerate the snapshot:"
            echo "  ./scripts/generate_abi_snapshot.sh"
            exit 1
          fi
          echo "No breaking ABI changes detected."

  error-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails on removed, reused or renumbered contract error codes (Issue
      # #1255). See stellar-contracts/docs/error-compatibility.md.
      - name: Check contract error compatibility
        working-directory: stellar-contracts
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if git show "origin/${BASE_REF}:stellar-contracts/error-codes.json" > "$RUNNER_TEMP/base-error-codes.json" 2>/dev/null; then
            python3 scripts/check_error_compat.py --base "$RUNNER_TEMP/base-error-codes.json"
          else
            python3 scripts/check_error_compat.py
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # Deploys the main, ownership/adoption/escrow and vet-registry contracts
      # into one local Soroban env (Issue #1253).
      # See stellar-contra

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # Deploys the main, ownership/adoption/escrow and vet-registry contracts
      # into one local Soroban env (Issue #1253).
      # See stellar-contracts/docs/cross-contract-compat.md.
      - name: Build main contract WASM
        working-directory: stellar-contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run cross-contract compatibility tests
        working-directory: stellar-contracts/contracts/pet-transfer-adoption
        run: |
          export PETCHAIN_MAIN_WASM=$(find "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/stellar-contracts/target" \
            -path '*wasm32-unknown-unknown/release/petchain_stellar.wasm' 2>/dev/null | head -n 1)
          test -n "$PETCHAIN_MAIN_WASM" || { echo "main contract WASM not found" >&2; exit 1; }
          # soroban-env-host accepts any ed25519-dalek >= 2; keep it on the 2.x
          # line that soroban-sdk's testutils are built against.
          cargo generate-lockfile
          cargo update -p ed25519-dalek@3.0.0 --precise 2.1.1 2>/dev/null || true
          cargo test test_cross_contract -- --include-ignored

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd7bfc695f644621a5a4 # stable

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage report
        working-directory: stellar-contracts
        run: cargo tarpaulin --out Xml --timeout 300 --exclude-files tests/* --output-dir coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@5ecb98a3c6b747ed38dc12a8f7ef13bd79982936 # v4.5.0
        with:
          files: ./stellar-contracts/coverage/cobertura.xml
          flags: stellar-contracts
          fail_ci_if_error: false

  stellar-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd7bfc695f644621a5a4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Build Stellar contracts
        working-directory: stellar-contracts
        run: cargo build --target wasm32-unknown-unknown --release

      # Soroban WASM contracts have a maximum binary size (currently ~128KB).
      # Fail CI as soon as a release build exceeds the configured budget.
      - name: Check contract WASM size
        working-directory: stellar-contracts
        run: |
          WASM_PATH=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name "*.wasm" | head -n 1)
          if [ -z "$WASM_PATH" ]; then
            echo "No WASM artifact found" >&2
            exit 1
          fi
          SIZE_KB=$(stat -c%s "$WASM_PATH" | awk '{print int($1/1024)}')
          echo "WASM size: ${SIZE_KB}KB ($WASM_PATH)"
          if [ "$SIZE_KB" -gt "$MAX_WASM_SIZE_KB" ]; then
            echo "ERROR: WASM size ${SIZE_KB}KB exceeds ${MAX_WASM_SIZE_KB}KB limit" >&2
            exit 1
          fi

      - name: Test Stellar contracts
        working-directory: stellar-contracts
        run: cargo test

  # Issue #1348: compile and test every workspace member individually so a
  # failure is attributed to a specific crate rather than the whole workspace.
  workspace-crates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - petchain-contract
          - petchain-registry
          - petchain-consent
          - petchain-claims
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Compile crate
        working-directory: stellar-contracts
        run: cargo build -p ${{ matrix.crate }} --all-features

      - name: Test crate
        working-directory: stellar-contracts
        run: cargo test -p ${{ matrix.crate }} --all-features

  # Issue #1345: Soroban resource-budget regression checks for the largest
  # workflows (registration, record, consent, cla

      # Validate simulation fixtures determinism, error-code mapping,
      # and JSON well-formedness (Issue #1354).
      - name: Validate simulation fixtures
        working-directory: stellar-contracts
        run: |
          python3 -m json.tool simulation-fixtures.json > /dev/null
          python3 -m json.tool simulation-fixtures.schema.json > /dev/null
          echo "Simulation fixtures JSON validation passed."

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Compile crate
        working-directory: stellar-contracts
        run: cargo build -p ${{ matrix.crate }} --all-features

      - name: Test crate
        working-directory: stellar-contracts
        run: cargo test -p ${{ matrix.crate }} --all-features

  # Issue #1345: Soroban resource-budget regression checks for the largest
  # workflows (registration, record, consent, claim, pagination).
  #
  # Budgets are documented per workflow in
  # stellar-contracts/docs/resource-budgets.md. The budget tests emit a
  # machine-readable snapshot (stellar-contracts/target/resource-budgets.json)
  # and fail with the specific regressed resource (instructions, memory, or
  # storage) when a workflow exceeds its documented budget.
  #
  # To intentionally update the baseline after a reviewed change, run the
  # "Update resource-budget baseline" step below (workflow_dispatch with
  # update_baseline=true) and commit the refreshed snapshot.
  resource-budgets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Run resource-budget regression checks
        working-directory: stellar-contracts
        run: cargo test --test resource_budgets -- --nocapture

      - name: Report regressed resource
        if: failure()
        working-directory: stellar-contracts
        run: |
          echo "::error::Soroban resource-budget regression detected. See the failing workflow above for the specific resource (instructions, memory, or storage) that exceeded its documented budget in docs/resource-budgets.md."

      - name: Upload resource-budget snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-budgets
          path: stellar-contracts/target/resource-budgets.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Update resource-budget baseline
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        working-directory: stellar-contracts
        run: |
          UPDATE_RESOURCE_BUDGET_BASELINE=1 cargo test --test resource_budgets -- --nocapture
          echo "Baseline snapshot refreshed at target/resource-budgets.json — commit it to update the documented budgets."

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Run clean-checkout reproducibility test
        working-directory: stellar-contracts
        run: bash scripts/clean_checkout_test.sh

      - name: Check for secrets in artifacts
        working-directory: stellar-contracts
        run: bash scripts/check_no_secrets.sh

      - name: Verify ABI snapshot is up to date
        working-directory: stellar-contracts
        run: bash scripts/generate_abi_snapshot.sh --check

      - name: Validate deployment manifest
        working-directory: stellar-contracts
        run: bash scripts/validate_manifest.sh --strict

      - name: Build Celo (Hardhat) artifacts
        working-directory: celo-contracts
        run: |
          npm ci
          npx hardhat compile

      - name: Validate Celo ABI artifacts
        working-directory: celo-contracts
        run: |
          missing=0
          for abi in $(find artifacts -name '*.json' -path '*contracts*' 2>/dev/null); do
            if ! jq -e '.abi' "$abi" >/dev/null 2>&1; then
              echo "ERROR: missing ABI in $abi" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ -z "$(find artifacts -name '*.json' -path '*contracts*' 2>/dev/null)" ]; then
            echo "ERROR: no Celo ABI artifacts produced" >&2
            exit 1
          fi

      - name: Local Celo deployment smoke test
        working-directory: celo-contracts
        run: npx hardhat test --network hardhat

      - name: Build Soroban artifacts
        working-directory: stellar-contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Validate Soroban WASM artifacts
        working-directory: stellar-contracts
        run: |
          WASM_COUNT=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' | wc -l)
          if [ "$WASM_COUNT" -eq 0 ]; then
            echo "ERROR: no Soroban WASM artifacts produced" >&2
            exit 1
          fi
          echo "Found ${WASM_COUNT} Soroban WASM artifact(s)"

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        working-directory: stellar-contracts
        run: cargo cyclonedx --format json --output-pattern package --override-filename sbom

      - name: Validate manifests
        run: |
          status=0
          for manifest in celo-contracts/deployments/*.json stellar-contracts/manifests/*.json; do
            if [ -f "$manifest" ]; then
              if ! jq -e . "$manifest" >/dev/null 2>&1; then
                echo "ERROR: invalid manifest JSON: $manifest" >&2
                status=1
              fi
            fi
          done
          if [ "$status" -ne 0 ]; then
            exit 1
          fi

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          WASM_PATH=$(find stellar-contracts/target/wasm32-unknown-unknown/release -maxdepth 1 -name "*.wasm" | head -n 1)
          if [ -z "$WASM_PATH" ]; then
            echo "No WASM artifact found" >&2
            exit 1
          fi
          cp "$WASM_PATH" release-artifacts/
          find stellar-contracts -maxdepth 2 -name "sbom*.json" -exec cp {} release-artifacts/ \;
          if ! ls release-artifacts/sbom*.json >/dev/null 2>&1; then
            echo "No SBOM generated" >&2
            exit 1
          fi

      - name: Generate checksums
        working-directory: release-artifacts
        run: sha256sum ./* > SHA256SUMS.txt

      - name: Write build metadata
        run: |
          cat > release-artifacts/build-metadata.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "${GITHUB_WORKFLOW}",
            "rustc": "$(rustc --version)",
            "cargo": "$(cargo --version)",
            "target": "wasm32-unknown-unknown"
          }
          EOF

      - name: Record compiler and runtime versions
        run: |
          mkdir -p release-metadata
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "stellar_cli=$(stellar --version 2>/dev/null || echo unknown)"
          } > release-metadata/versions.txt
          cat release-metadata/versions.txt

      - name: Upload SBOM and release artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: contract-sbom-provenance
          path: release-artifacts/
          retention-days: 90

      - name: Upload release metadata
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: cross-network-release-metadata
          path: release-metadata/versions.txt
          retention-days: 30

      - name: Generate signed build provenance
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a09fbfe76846d4 # v2.0.0
        with:
          subject-path: release-artifacts/*

  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

  deploy-testnet:
    runs-on: ubuntu-latest
    needs: stellar-contracts
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

  deploy-testnet:
    runs-on: ubuntu-latest
    needs: stellar-contracts
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd7bfc695f644621a5a4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Build contract WASM
        working-directory: stellar-contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Generate deployer keypair
        run: |
          stellar keys generate deployer --network testnet
          stellar keys address deployer

      - name: Fund deployer account via Friendbot
        run: |
          DEPLOYER_ADDRESS=$(stellar keys address deployer)
          curl -s "https://friendbot.stellar.org?addr=${DEPLOYER_ADDRESS}" | jq .

      - name: Deploy contract to testnet
        id: deploy
        run: |
          WASM_PATH=$(find stellar-contracts/target/wasm32-unknown-unknown/release -name "*.wasm" | head -1)
          CONTRACT_ID=$(stellar contract deploy \
            --wasm "$WASM_PATH" \
            --source deployer \
            --network testnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE")
          echo "contract_id=${CONTRACT_ID}" >> "$GITHUB_OUTPUT"
          echo "Deployed contract: ${CONTRACT_ID}"

      - name: Verify deployment via get_contract_version
        run: |
          stellar contract invoke \
            --id "${{ steps.deploy.outputs.contract_id }}" \
            --source deployer \
            --network testnet \
            --rpc-url "$STELLAR_RPC_URL" \
            --network-passphrase "$STELLAR_NETWORK_PASSPHRASE" \
            -- get_contract_version

      - name: Save contract ID artifact
        run: echo "${{ steps.deploy.outputs.contract_id }}" > contract_id.txt

      - name: Upload contract ID artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: testnet-contract-id
          path: contract_id.txt
          retention-days: 30

      - name: Notify on deployment failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
